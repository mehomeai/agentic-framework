[project]
name = "me-runtime"
version = "0.2.0"
description = "Me home agent runtime (runtime-bridge-v1 CLI subprocess bridge)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.10",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-ollama>=0.3",
  "langchain-openai>=1",
  "langchain-anthropic>=1",
  "httpx>=0.27",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright==1.64.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
